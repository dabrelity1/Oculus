buildscript {
    repositories {
        maven { name = "forge"; url = "https://maven.minecraftforge.net" }
        maven { name = "sonatype"; url = "https://oss.sonatype.org/content/repositories/snapshots/" }
        mavenCentral()
        jcenter()
        maven {
            name = "spongepowered"
            url = "https://repo.spongepowered.org/maven"
        }
        maven {
            name = "cleanroom"
            url = "https://repo.cleanroommc.com/releases"
        }
        maven {
            name = "blamejared"
            url = "https://maven.blamejared.com"
        }
    }
    dependencies {
        classpath "net.minecraftforge.gradle:ForgeGradle:2.3-SNAPSHOT"
    }
}

apply plugin: "net.minecraftforge.gradle.forge"

version = "0.1.0"
group = "net.coderbot"
archivesBaseName = "oculus"

sourceCompatibility = targetCompatibility = "1.8"

def relictiumVersion = "1.2.0"

minecraft {
    version = "1.12.2-14.23.5.2768"
    runDir = "run"
    mappings = "stable_39"
    makeObfSourceJar = false
}

repositories {
    maven {
        name = "ForgeMaven"
        url = "https://maven.minecraftforge.net"
    }
    maven {
        name = "Modrinth"
        url = "https://api.modrinth.com/maven"
    }
    maven {
        name = "CleanroomMC"
        url = "https://repo.cleanroommc.com/releases"
    }
    maven {
        name = "Rongmario"
        url = "https://maven.rongmario.com"
    }
}

dependencies {
    deobfCompile "maven.modrinth:relictium:${relictiumVersion}"
    compile "org.spongepowered:mixin:0.8.5"
    compile "zone.rong:mixinbooter:8.0"
    annotationProcessor "org.spongepowered:mixin:0.8.5:processor"
    compile("org.anarres:jcpp:1.4.14") {
        transitive = false
    }
    compile("org.slf4j:slf4j-api:1.7.12") {
        transitive = false
    }
    testCompile "junit:junit:4.13.2"
}

def mixinConfigName = "oculus.mixins.json"
def mcVersionBase = minecraft.version.contains('-') ? minecraft.version.substring(0, minecraft.version.indexOf('-')) : minecraft.version
def mappingParts = minecraft.mappings.split('_')
def mappingDir = new File(gradle.gradleUserHomeDir,
        "caches/minecraft/de/oceanlabs/mcp/mcp_${mappingParts[0]}/${mappingParts[1]}/${mcVersionBase}/srgs")
def inSrgFile = new File(mappingDir, "mcp-srg.srg")
def inNotchFile = new File(mappingDir, "mcp-notch.srg")
def outRefmapFile = file("${buildDir}/resources/main/oculus.refmap.json")
def outSrgFile = file("${buildDir}/tmp/compileJava/mcp-srg.srg")
def outNotchFile = file("${buildDir}/tmp/compileJava/mcp-notch.srg")

tasks.withType(JavaCompile).configureEach { compileTask ->
    compileTask.doFirst {
        outRefmapFile.parentFile.mkdirs()
        outSrgFile.parentFile.mkdirs()
    }
    compileTask.options.compilerArgs += [
        "-AdefaultObfuscationEnv=searge",
        "-AoutRefMapFile=${outRefmapFile}",
        "-AreobfSrgFile=${inSrgFile}",
        "-AreobfNotchSrgFile=${inNotchFile}",
        "-AoutSrgFile=${outSrgFile}",
        "-AoutNotchSrgFile=${outNotchFile}"
    ]
}

processResources {
    inputs.property "version", project.version
    inputs.property "mcversion", project.minecraft.version

    from(sourceSets.main.resources.srcDirs) {
        include "**/*"
    }
}

jar {
    manifest {
        attributes(
            "FMLCorePlugin": "net.oculus.mixins.OculusMixinLoader",
            "FMLCorePluginContainsFMLMod": "true",
            "ForceLoadAsMod": "true"
        )
    }
}

tasks.getByName("runClient") {
    jvmArgs "-Dmixin.debug.verbose=true", "-Dmixin.debug.export=true"

    ["oculus.validation.autoJoinWorld", "oculus.validation.exitAfterWorldTicks", "oculus.validation.pbrTextures", "oculus.validation.screenshotWorldTick", "oculus.validation.inventoryScreenshotWorldTick", "oculus.validation.dumpRenderTargets", "oculus.validation.dumpRenderTargetsWorldTick", "oculus.validation.thirdPersonView", "oculus.validation.worldTime", "oculus.validation.shaderPack"].each { propertyName ->
        def propertyValue = System.getProperty(propertyName)
        if (propertyValue != null) {
            jvmArgs "-D${propertyName}=${propertyValue}"
        }
    }

    def javaHome = System.getenv("JAVA_HOME")
    if (javaHome) {
        def candidate = new File(javaHome, "bin/java")
        if (!candidate.exists()) {
            candidate = new File(javaHome, "bin/java.exe")
        }
        if (candidate.exists()) {
            executable = candidate.absolutePath
        }
    }
}

// Fix asset download - ForgeGradle 2.3 uses deprecated HTTP URL (http://resources.download.minecraft.net)
// which now returns 400 errors. This task downloads assets using HTTPS instead.
import groovy.json.JsonSlurper

task downloadAssetsHttps {
    def assetsDir = new File(gradle.gradleUserHomeDir, "caches/minecraft/assets")
    def objectsDir = new File(assetsDir, "objects")
    def indexesDir = new File(assetsDir, "indexes")

    outputs.dir(assetsDir)

    doLast {
        objectsDir.mkdirs()
        indexesDir.mkdirs()

        // Get asset index file
        def indexFile = new File(indexesDir, "1.12.json")
        if (!indexFile.exists()) {
            println "Downloading asset index..."
            def indexUrl = "https://piston-meta.mojang.com/mc/assets/1.12/67e29e024e664064c1f04c728604f83c24cbc218/1.12.json"
            indexFile.parentFile.mkdirs()
            indexFile.text = new URL(indexUrl).text
        }

        // Parse asset index
        def index = new JsonSlurper().parseText(indexFile.text)
        def objects = index.objects

        def downloadCount = 0
        def skipCount = 0
        def failCount = 0

        objects.each { name, info ->
            def hash = info.hash
            def prefix = hash.substring(0, 2)
            def targetDir = new File(objectsDir, prefix)
            def targetFile = new File(targetDir, hash)

            if (targetFile.exists() && targetFile.length() == info.size) {
                skipCount++
                return
            }

            targetDir.mkdirs()

            def assetUrl = "https://resources.download.minecraft.net/${prefix}/${hash}"

            try {
                def connection = new URL(assetUrl).openConnection()
                connection.connectTimeout = 10000
                connection.readTimeout = 30000

                targetFile.withOutputStream { out ->
                    out << connection.inputStream
                }
                downloadCount++

                if (downloadCount % 100 == 0) {
                    println "Downloaded ${downloadCount} assets..."
                }
            } catch (Exception e) {
                failCount++
                if (failCount <= 10) {
                    println "Warning: Failed to download ${name}: ${e.message}"
                }
            }
        }

        println "Asset download complete: ${downloadCount} downloaded, ${skipCount} cached, ${failCount} failed"
    }
}

// Replace the original getAssets task with our HTTPS version
tasks.getAssets.enabled = false
tasks.makeStart.dependsOn downloadAssetsHttps
